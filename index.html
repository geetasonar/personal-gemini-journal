<!doctype html>
<html lang="en" data-theme="indigo" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply theme immediately to eliminate initial render flash
      (function () {
        try {
          var saved = localStorage.getItem('personal_gemini_journal_theme');
          var theme = saved || 'indigo';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'obsidian' || theme === 'indigo') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Global sandbox compatibility: ensure window.fetch has both getter and setter
      (function () {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch || originalFetch;
            },
            set(newFetch) {
              currentFetch = typeof newFetch === 'function' ? newFetch : originalFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if property is non-configurable
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
